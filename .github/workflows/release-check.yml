name: Release validation

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact v-prefixed SemVer tag being validated
        required: true
        default: v3.0.0-rc.1
        type: string
      base_ref:
        description: Git commit or ref immediately before this release's changes
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Offline release checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CI: "1"
      MULTILOGIN_REQUIRE_TOOLING: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install test tooling
        run: |
          timeout 120s sudo apt-get update
          timeout 120s sudo apt-get install --no-install-recommends \
            busybox \
            jq \
            nodejs \
            npm \
            shellcheck \
            shfmt

      - name: Verify source release matrix
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node tools/release/version-matrix.mjs --tag "$RELEASE_TAG"

      - name: Require the full package release gate
        env:
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          set -eu
          BASE_SHA=$(git rev-parse --verify --end-of-options "$BASE_REF^{commit}")
          git diff --name-only "$BASE_SHA" "$GITHUB_SHA" >changed-paths.txt
          node tools/release/change-scope.mjs --paths-file changed-paths.txt --require package

      - name: Run offline tests
        run: timeout 60s ./tests/run.sh

  sdk-build:
    name: Release SDK matrix
    needs: test
    uses: ./.github/workflows/sdk-build.yml
