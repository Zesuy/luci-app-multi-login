name: Release validation

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact v-prefixed SemVer tag being validated
        required: true
        default: v3.0.0-rc.1
        type: string
      base_ref:
        description: Git commit or ref immediately before this release's changes
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Offline release checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CI: "1"
      MULTILOGIN_REQUIRE_TOOLING: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install test tooling
        run: |
          timeout 120s sudo apt-get update
          timeout 120s sudo apt-get install --no-install-recommends \
            busybox \
            jq \
            nodejs \
            npm \
            shellcheck \
            shfmt

      - name: Verify source release matrix
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node tools/release/version-matrix.mjs --tag "$RELEASE_TAG"

      - name: Require the full package release gate
        env:
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          set -eu
          BASE_SHA=$(git rev-parse --verify --end-of-options "$BASE_REF^{commit}")
          git diff --name-only "$BASE_SHA" "$GITHUB_SHA" >changed-paths.txt
          node tools/release/change-scope.mjs --paths-file changed-paths.txt --require package

      - name: Run offline tests
        run: timeout 60s ./tests/run.sh

  sdk-build:
    name: SDK ${{ matrix.sdk_version }} x86_64
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk_version: 23.05.6
            sdk_url: https://downloads.openwrt.org/releases/23.05.6/targets/x86/64/openwrt-sdk-23.05.6-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.xz
            sdk_sha256: f22bdac5b702bb823a0ee802e9bbda2a56c0f7a2687e5090113b00910dac995f
            sdk_archive_extension: .tar.xz
            feed_branch: openwrt-23.05
            artifact_name: luci-app-multilogin-openwrt-23.05.6-x86-64
            package_format: ipk
            release_style: plain
          - sdk_version: 24.10.8
            sdk_url: https://downloads.openwrt.org/releases/24.10.8/targets/x86/64/openwrt-sdk-24.10.8-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst
            sdk_sha256: ac4a0405d2eea821b06f93c14ba13ffa90ad0457648903df7dde02570027ab21
            sdk_archive_extension: .tar.zst
            feed_branch: openwrt-24.10
            artifact_name: luci-app-multilogin-openwrt-24.10.8-x86-64
            package_format: ipk
            release_style: r
          - sdk_version: 25.12.5
            sdk_url: https://downloads.openwrt.org/releases/25.12.5/targets/x86/64/openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            sdk_sha256: 0c8df0151a1e88feb7c03d694d61f6a18d51872815b7c811d76e2b77504d5e9c
            sdk_archive_extension: .tar.zst
            feed_branch: openwrt-25.12
            artifact_name: luci-app-multilogin-openwrt-25.12.5-x86-64
            package_format: apk
            release_style: r
    uses: ./.github/workflows/sdk-build.yml
    with:
      sdk_version: ${{ matrix.sdk_version }}
      sdk_url: ${{ matrix.sdk_url }}
      sdk_sha256: ${{ matrix.sdk_sha256 }}
      sdk_archive_extension: ${{ matrix.sdk_archive_extension }}
      feed_branch: ${{ matrix.feed_branch }}
      artifact_name: ${{ matrix.artifact_name }}
      package_format: ${{ matrix.package_format }}
      release_style: ${{ matrix.release_style }}
