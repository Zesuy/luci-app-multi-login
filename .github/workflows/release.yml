name: Create release draft

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact v-prefixed SemVer tag to release
        required: true
        default: v3.0.0-rc.1
        type: string
      artifact_run_id:
        description: Successful SDK workflow run ID for this exact commit
        required: true
        type: string
      base_ref:
        description: Git commit or ref immediately before this release's changes
        required: true
        type: string
      confirm_release:
        description: Type CREATE_DRAFT to create the tag and draft release
        required: true
        type: string

# Ordinary pushes and pull requests never enter this workflow. The release job
# additionally requires the protected GitHub `release` environment.
permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify candidate and SDK artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out selected commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release confirmation
        env:
          CONFIRM_RELEASE: ${{ inputs.confirm_release }}
        run: test "$CONFIRM_RELEASE" = CREATE_DRAFT

      - name: Verify source release matrix
        run: node tools/release/version-matrix.mjs --tag '${{ inputs.tag }}'

      - name: Require the full package release gate
        env:
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          git diff --name-only "$BASE_REF" "$GITHUB_SHA" > changed-paths.txt
          node tools/release/change-scope.mjs --paths-file changed-paths.txt --require package

      - name: Verify SDK workflow provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.artifact_run_id }}
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq .conclusion)" = success
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq .head_sha)" = "$EXPECTED_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq .path)" = .github/workflows/ci.yml
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq .event)" = push
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq .head_repository.full_name)" = "$EXPECTED_REPOSITORY"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq .head_branch)" = "$EXPECTED_BRANCH"

      - name: Download verified SDK artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: release-artifacts

      - name: Inspect IPK metadata and checksums
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          find release-artifacts -type f -name 'luci-app-multilogin_*.ipk' -print | LC_ALL=C sort > ipks.txt
          test "$(wc -l < ipks.txt)" -eq 2
          while IFS= read -r ipk; do
            checksums="$(dirname "$ipk")/sha256sums.txt"
            test -f "$checksums"
            case "$ipk" in
              *openwrt-23.05.*) release_style=plain ;;
              *openwrt-24.10.*) release_style=r ;;
              *) echo "unknown SDK artifact path: $ipk" >&2; exit 1 ;;
            esac
            sh tools/release/inspect-artifact.sh --ipk "$ipk" --checksums "$checksums" \
              --tag "$RELEASE_TAG" --release-style "$release_style"
            basename "$ipk" >> ipk-names.txt
          done < ipks.txt
          test "$(sort -u ipk-names.txt | wc -l)" -eq 2

      - name: Create release notes
        run: node tools/release/release-notes.mjs --version '${{ inputs.tag }}' --output release-notes.md

      - name: Assemble verified release bundle
        run: |
          mkdir release-bundle
          cp release-notes.md release-bundle/
          while IFS= read -r ipk; do cp "$ipk" release-bundle/; done < ipks.txt
          (
            cd release-bundle
            sha256sum luci-app-multilogin_*.ipk > sha256sums.txt
          )

      - name: Upload verified release bundle
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: verified-release-bundle
          path: release-bundle
          if-no-files-found: error
          retention-days: 1

  create-draft:
    name: Create protected release draft
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out selected commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download verified release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-release-bundle
          path: release-bundle

      - name: Create tag and draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)" = ''
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "release tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" release-bundle/luci-app-multilogin_*.ipk release-bundle/sha256sums.txt \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes-file release-bundle/release-notes.md \
            --draft
