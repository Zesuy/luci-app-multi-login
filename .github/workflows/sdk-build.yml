name: Reusable OpenWrt SDK build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  compile:
    name: Compile ${{ matrix.sdk_version }} x86_64 witness
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk_version: 24.10.8
            sdk_url: https://downloads.openwrt.org/releases/24.10.8/targets/x86/64/openwrt-sdk-24.10.8-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst
            sdk_sha256: ac4a0405d2eea821b06f93c14ba13ffa90ad0457648903df7dde02570027ab21
            sdk_archive_extension: .tar.zst
            feed_branch: openwrt-24.10
            artifact_name: luci-app-multilogin-openwrt-24.10.8-x86-64
            package_format: ipk
            release_style: r
          - sdk_version: 25.12.5
            sdk_url: https://downloads.openwrt.org/releases/25.12.5/targets/x86/64/openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            sdk_sha256: 0c8df0151a1e88feb7c03d694d61f6a18d51872815b7c811d76e2b77504d5e9c
            sdk_archive_extension: .tar.zst
            feed_branch: openwrt-25.12
            artifact_name: luci-app-multilogin-openwrt-25.12.5-x86-64
            package_format: apk
            release_style: r
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Restore verified SDK archive
        id: sdk-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/multilogin-sdk-${{ matrix.sdk_version }}${{ matrix.sdk_archive_extension }}
          key: openwrt-sdk-${{ runner.os }}-x86-64-${{ matrix.sdk_version }}-${{ matrix.sdk_sha256 }}

      - name: Install bounded host build tooling
        run: |
          timeout 120s sudo apt-get update
          timeout 180s sudo apt-get install --no-install-recommends \
            build-essential \
            file \
            gawk \
            gettext \
            busybox \
            git \
            libncurses-dev \
            nodejs \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zstd

      - name: Download and verify official SDK
        env:
          SDK_URL: ${{ matrix.sdk_url }}
          SDK_SHA256: ${{ matrix.sdk_sha256 }}
        run: |
          set -eu
          SDK_ARCHIVE="$RUNNER_TEMP/multilogin-sdk-${{ matrix.sdk_version }}${{ matrix.sdk_archive_extension }}"
          case "$SDK_URL" in
            https://downloads.openwrt.org/releases/*) ;;
            *) echo 'SDK URL must use the official OpenWrt releases host' >&2; exit 1 ;;
          esac
          case "$SDK_SHA256" in
            '' | *[!0-9a-f]*) echo 'SDK checksum must be lowercase SHA-256' >&2; exit 1 ;;
          esac
          test "${#SDK_SHA256}" -eq 64 || {
            echo 'SDK checksum must contain exactly 64 characters' >&2
            exit 1
          }
          if [ ! -f "$SDK_ARCHIVE" ]; then
            curl --fail --show-error --location --proto '=https' --tlsv1.2 \
              --retry 2 --retry-all-errors --connect-timeout 15 --max-time 300 \
              --max-filesize 400M "$SDK_URL" --output "$SDK_ARCHIVE"
          fi
          printf '%s  %s\n' "$SDK_SHA256" "$SDK_ARCHIVE" | sha256sum --check --status

      - name: Extract verified SDK
        run: |
          set -eu
          SDK_ARCHIVE="$RUNNER_TEMP/multilogin-sdk-${{ matrix.sdk_version }}${{ matrix.sdk_archive_extension }}"
          SDK_ROOT="$RUNNER_TEMP/multilogin-sdk-${{ matrix.sdk_version }}"
          rm -rf "$SDK_ROOT"
          mkdir -p "$SDK_ROOT"
          tar --extract --file "$SDK_ARCHIVE" --directory "$SDK_ROOT" --strip-components=1
          test -x "$SDK_ROOT/scripts/feeds"
          test -f "$SDK_ROOT/include/toplevel.mk"

      - name: Verify real SDK JSHN contract
        working-directory: ${{ runner.temp }}/multilogin-sdk-${{ matrix.sdk_version }}
        env:
          MULTILOGIN_JSHN_ROOT: ${{ runner.temp }}/multilogin-sdk-${{ matrix.sdk_version }}/staging_dir/host
          MULTILOGIN_BUSYBOX: /usr/bin/busybox
          MULTILOGIN_REQUIRE_JSHN: "1"
        run: |
          set -eu
          test -f "$MULTILOGIN_JSHN_ROOT/share/libubox/jshn.sh"
          test -x "$MULTILOGIN_JSHN_ROOT/bin/jshn"
          timeout 30s node "$GITHUB_WORKSPACE/tests/test-jshn-contract.mjs"

      - name: Integrate required OpenWrt package feeds
        env:
          FEED_BRANCH: ${{ matrix.feed_branch }}
        working-directory: ${{ runner.temp }}/multilogin-sdk-${{ matrix.sdk_version }}
        run: |
          set -eu
          case "$FEED_BRANCH" in
            openwrt-24.10 | openwrt-25.12) ;;
            *) echo 'unsupported OpenWrt feed branch' >&2; exit 1 ;;
          esac
          sed -i \
            -e "s#;openwrt-[0-9.][0-9.]*#;$FEED_BRANCH#g" \
            feeds.conf.default
          timeout 180s ./scripts/feeds update base packages luci routing
          # Install definitions from the updated feeds so transitive build
          # dependencies (for example lucihttp's Lua headers) are available.
          # Only the selected package dependency graph is compiled below.
          timeout 120s ./scripts/feeds install -a

      - name: Add package feed and compile
        working-directory: ${{ runner.temp }}/multilogin-sdk-${{ matrix.sdk_version }}
        run: |
          set -eu
          umask 022
          mkdir -p package/multilogin
          ln -s "$GITHUB_WORKSPACE" package/multilogin/luci-app-multilogin
          timeout 120s make defconfig
          timeout 1200s make package/luci-app-multilogin/compile -j2 V=s

      - name: Stage package build output and checksum
        id: artifact
        env:
          PACKAGE_FORMAT: ${{ matrix.package_format }}
          RELEASE_STYLE: ${{ matrix.release_style }}
        working-directory: ${{ runner.temp }}/multilogin-sdk-${{ matrix.sdk_version }}
        run: |
          set -eu
          case "$PACKAGE_FORMAT:$RELEASE_STYLE" in
            ipk:plain | ipk:r | apk:r) ;;
            *) echo 'unsupported package format or release style' >&2; exit 1 ;;
          esac
          case "$PACKAGE_FORMAT" in
            ipk) PACKAGE_GLOB='luci-app-multilogin_*.ipk' ;;
            apk) PACKAGE_GLOB='luci-app-multilogin-*.apk' ;;
          esac
          set -- $(find bin/packages -type f -name "$PACKAGE_GLOB" -print | LC_ALL=C sort)
          test "$#" -eq 1
          mkdir artifact
          cp "$1" artifact/
          (
            cd artifact
            sha256sum "$(basename "$1")" >sha256sums.txt
          )
          RELEASE_TAG="v$(sed -n 's/^PKG_SOURCE_VERSION:=//p' "$GITHUB_WORKSPACE/Makefile")"
          case "$PACKAGE_FORMAT" in
            ipk)
              sh "$GITHUB_WORKSPACE/tools/release/inspect-artifact.sh" \
                --ipk "$PWD/artifact/$(basename "$1")" \
                --checksums "$PWD/artifact/sha256sums.txt" \
                --tag "$RELEASE_TAG" \
                --release-style "$RELEASE_STYLE"
              ;;
            apk)
              APK_TOOL="$PWD/staging_dir/host/bin/apk"
              test -x "$APK_TOOL"
              APK_HOST_BIN="$(dirname "$APK_TOOL")"
              APK_HOST_LIB="$APK_HOST_BIN/../lib"
              mkdir -p artifact/apk-runtime/bin artifact/apk-runtime/lib
              cp "$APK_HOST_BIN/.apk.bin" artifact/apk-runtime/bin/apk.bin
              for runtime in ld-linux-x86-64.so.2 libc.so.6 libpthread.so.0 runas.so; do
                cp "$APK_HOST_LIB/$runtime" artifact/apk-runtime/lib/
              done
              printf '%s\n' \
                '#!/bin/sh' \
                'tool_root=$(CDPATH= cd -- "$(dirname -- "$0")/apk-runtime" && pwd)' \
                'export RUNAS_ARG0="$0"' \
                'export LD_PRELOAD="${LD_PRELOAD:+$LD_PRELOAD:}$tool_root/lib/runas.so"' \
                'exec "$tool_root/lib/ld-linux-x86-64.so.2" --library-path "$tool_root/lib" "$tool_root/bin/apk.bin" "$@"' \
                >artifact/apk-tool
              chmod 0755 artifact/apk-tool
              sh "$GITHUB_WORKSPACE/tools/release/inspect-artifact.sh" \
                --apk "$PWD/artifact/$(basename "$1")" \
                --apk-tool "$PWD/artifact/apk-tool" \
                --checksums "$PWD/artifact/sha256sums.txt" \
                --tag "$RELEASE_TAG" \
                --release-style "$RELEASE_STYLE"
              ;;
          esac
          printf 'artifact_path=%s\n' "$PWD/artifact" >>"$GITHUB_OUTPUT"

      - name: Upload package build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ steps.artifact.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 7
