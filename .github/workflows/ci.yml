name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Classify changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      base_sha: ${{ steps.classify.outputs.base_sha }}
      scope: ${{ steps.classify.outputs.scope }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify release scope
        id: classify
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -eu
          if [ -n "$PR_BASE_SHA" ]; then
            BASE_SHA=$PR_BASE_SHA
          elif [ -n "$PUSH_BASE_SHA" ] && [ "$PUSH_BASE_SHA" != 0000000000000000000000000000000000000000 ]; then
            BASE_SHA=$PUSH_BASE_SHA
          else
            BASE_SHA=$(git merge-base "$GITHUB_SHA" "origin/$DEFAULT_BRANCH")
          fi
          git cat-file -e "$BASE_SHA^{commit}"
          git diff --name-only "$BASE_SHA" "$GITHUB_SHA" >changed-paths.txt
          node tools/release/change-scope.mjs --paths-file changed-paths.txt >scope.json
          SCOPE=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('scope.json', 'utf8')).scope)")
          printf 'base_sha=%s\n' "$BASE_SHA" >>"$GITHUB_OUTPUT"
          printf 'scope=%s\n' "$SCOPE" >>"$GITHUB_OUTPUT"

  test:
    name: Offline test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CI: "1"
      MULTILOGIN_REQUIRE_TOOLING: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install test tooling
        run: |
          timeout 120s sudo apt-get update
          timeout 120s sudo apt-get install --no-install-recommends \
            busybox \
            jq \
            nodejs \
            npm \
            shellcheck \
            shfmt

      - name: Run offline tests
        run: timeout 60s ./tests/run.sh

  sdk-build:
    name: Release SDK matrix
    needs: [scope, test]
    if: needs.scope.outputs.scope == 'package'
    uses: ./.github/workflows/sdk-build.yml

  shell-only:
    name: Shell-only version gate
    needs: [scope, test]
    if: needs.scope.outputs.scope == 'shell-only'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check out repository history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a compatible script version increase
        env:
          BASE_SHA: ${{ needs.scope.outputs.base_sha }}
        run: |
          git show "$BASE_SHA:etc/multilogin/cqu-portal.sh" >"$RUNNER_TEMP/base-cqu-portal.sh"
          node tools/release/change-scope.mjs --path etc/multilogin/cqu-portal.sh --require shell-only
          node tools/release/script-version.mjs --base-script "$RUNNER_TEMP/base-cqu-portal.sh"
